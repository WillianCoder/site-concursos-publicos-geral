name: Radar de Editais

on:
  schedule:
    - cron: '23 10 * * *'   # todo dia às 07:23 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vigiar os sites oficiais
        run: node scripts/radar.mjs
      - name: Salvar novidades
        run: |
          git config user.name "atlas-radar[bot]"
          git config user.email "atlas-radar@users.noreply.github.com"
          git add data/radar.js data/radar-state.json
          if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
          git commit -m "Radar de Editais: atualização de $(TZ=America/Sao_Paulo date +%F)"
          git push
