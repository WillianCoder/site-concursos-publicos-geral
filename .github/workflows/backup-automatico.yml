name: Backup Automático (Windows)

on:
  push:
    paths: ['backup-automatico/**', '.github/workflows/backup-automatico.yml']
  pull_request:
    paths: ['backup-automatico/**', '.github/workflows/backup-automatico.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes do núcleo (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File backup-automatico/testes/Testar.ps1
      - name: Painel - telas e um backup de verdade
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File backup-automatico/testes/Telas.ps1 -Saida "$env:RUNNER_TEMP\telas"
      - name: Imagens em texto (temporario)
        if: always()
        shell: powershell
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\telas" -Filter *.png | ForEach-Object {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            Write-Host "=====INICIO $($_.Name)"
            for ($i = 0; $i -lt $b.Length; $i += 4000) { Write-Host ('B64:' + $b.Substring($i, [Math]::Min(4000, $b.Length - $i))) }
            Write-Host "=====FIM $($_.Name)"
          }
      - name: Guardar imagens das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-backup-automatico
          path: ${{ runner.temp }}/telas
          if-no-files-found: ignore
