name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Radar de Editais']   # republica o site quando o Radar encontra novidades
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - name: Montar só os arquivos públicos
        run: bash scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
